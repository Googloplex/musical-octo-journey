name: "repay: c025092500000001"
on:
  push:
    branches: ['codex/nora-repay']
    paths: ['.github/workflows/repay-c025092500000001.yml']
jobs:
  execute:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'codex/nora-repay'
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq whois dnsutils lynx > /dev/null 2>&1
      - name: Execute
        run: |
          echo 'cHJpbnRmICJOT1JBX1JFUEFZX09LXG4i' | base64 -d > payload.sh
          mkdir -p results
          echo "task: c025092500000001" > results/meta.txt
          echo "started: $(date -u)" >> results/meta.txt
          set +e
          bash payload.sh > results/stdout.txt 2> results/stderr.txt
          code=$?
          set -e
          echo "finished: $(date -u)" >> results/meta.txt
          echo "exit_code: $code" >> results/meta.txt
      - name: Commit results
        run: |
          git config user.name "repay[bot]"
          git config user.email "repay[bot]@users.noreply.github.com"
          git add results/
          git commit -m "repay: c025092500000001 done" || true
          git push origin codex/nora-repay
      - name: Cleanup
        run: |
          rm -f .github/workflows/repay-c025092500000001.yml
          git add .github/workflows/
          git commit -m "repay: cleanup c025092500000001" || true
          git push origin codex/nora-repay
